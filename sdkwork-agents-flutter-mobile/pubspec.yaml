name: sdkwork_agents_flutter_mobile
description: SDKWork Agents Flutter Mobile Application
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  sdkwork_agents_flutter_mobile_core:
    path: packages/sdkwork_agents_flutter_mobile_core
  sdkwork_agents_flutter_mobile_commons:
    path: packages/sdkwork_agents_flutter_mobile_commons
  sdkwork_agents_flutter_mobile_shell:
    path: packages/sdkwork_agents_flutter_mobile_shell
  sdkwork_agents_flutter_mobile_agents:
    path: packages/sdkwork_agents_flutter_mobile_agents
  sdkwork_agents_flutter_mobile_conversation:
    path: packages/sdkwork_agents_flutter_mobile_conversation
  sdkwork_agents_flutter_mobile_library:
    path: packages/sdkwork_agents_flutter_mobile_library
  sdkwork_agents_flutter_mobile_projects:
    path: packages/sdkwork_agents_flutter_mobile_projects
  sdkwork_agents_flutter_mobile_automation:
    path: packages/sdkwork_agents_flutter_mobile_automation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  sdkwork_common_flutter:
    path: ../../../sdkwork-sdk-commons/sdkwork-sdk-common-flutter

flutter:
  uses-material-design: true
